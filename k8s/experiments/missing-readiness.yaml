apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfhealing-demo
  labels:
    app: selfhealing-demo
    experiment: missing-readiness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: selfhealing-demo
  template:
    metadata:
      labels:
        app: selfhealing-demo
    spec:
      containers:
        - name: app
          image: selfhealing-demo:v1
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          # CỐ Ý SAI: Hoàn toàn không có readinessProbe
          # Hậu quả: Ngay khi container start, K8s đánh dấu Pod Ready ngay lập tức và đẩy traffic vào
          # Trong khi app chưa nạp xong, client sẽ nhận lỗi 502/503 Connection Refused

