apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: selfhealing-demo-ingress
  labels:
    app: selfhealing-demo
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: selfhealing.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: selfhealing-demo-svc
                port:
                  number: 80

