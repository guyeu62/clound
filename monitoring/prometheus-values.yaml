# Helm values for kube-prometheus-stack
# Optimized for local kind cluster testing

grafana:
  adminPassword: "admin"
  service:
    type: ClusterIP
    port: 80

prometheus:
  prometheusSpec:
    # Cho phép Prometheus tự động cào mọi ServiceMonitor mà không cần nhãn Helm release
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alertmanager:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

