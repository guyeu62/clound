apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: selfhealing-demo-servicemonitor
  namespace: default
  labels:
    app: selfhealing-demo
spec:
  selector:
    matchLabels:
      app: selfhealing-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s

